name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole file before building anything, so a
  # tag on a commit that fails CI never publishes.
  workflow_call:

# A new push supersedes the run in flight for the same ref. Only main is
# exempt: its history is what releases are cut from, so every commit there
# gets a verdict of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Actions are pinned to a full commit SHA, with the version in a comment:
# a tag can be moved, a SHA cannot. Dependabot keeps both up to date.
env:
  # No older than the go directive in desktop/go.mod: setup-go sets
  # GOTOOLCHAIN=local, so an older Go stops there instead of fetching a newer
  # toolchain.
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both transports are compiled and unit-tested where they actually
        # run. transport_linux.go and transport_windows.go share no code, and
        # a build error in one is invisible from the other.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Not ./... : main.go embeds frontend/dist, which is git-ignored and not
      # built in this job. See CLAUDE.md.
      - name: Vet
        run: go vet ./internal/... ./cmd/...

      # -race only on Linux: on Windows the detector needs an external C
      # toolchain that the runner image happens to provide but does not
      # guarantee, and the concurrency being tested (readLoop, the callbacks,
      # drain) is platform independent anyway.
      - name: Test (with race detector)
        if: runner.os == 'Linux'
        run: go test -race ./internal/...

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./internal/...

      - name: Build peatsctl
        run: go build ./cmd/peatsctl

  probe:
    name: Probe (Linux only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No go.sum: the probe has no dependency, so there is nothing to cache —
      # and setup-go fails its cache step looking for one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # A separate module carrying //go:build linux: raw AF_BLUETOOTH sockets
      # exist nowhere else.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

  i18n:
    name: Translation catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Catalogues drift silently: a missing key renders as a raw identifier
      # and a mismatched placeholder drops an interpolated value. Neither is
      # visible in a diff of two JSON files.
      - name: Go catalogues
        working-directory: desktop
        run: go test ./internal/i18n/ -v

      # Also checks that every key the Go side emits exists in the UI
      # catalogue, since nothing in the frontend source names those.
      - name: UI catalogues
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run check:locales

      - name: Android string resources
        run: python3 .github/scripts/check-android-strings.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-desktop
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The Svelte app imports ../wailsjs/go/main/App, which is generated from
      # the Go bindings and git-ignored. Without this step the build fails on
      # a missing module — and regenerating it here is also what catches a
      # frontend call to a method the Go side no longer exposes.
      - name: Generate Wails bindings
        working-directory: desktop
        run: wails generate module

      - name: Install
        working-directory: desktop/frontend
        run: npm ci

      # svelte-check type-checks the components against the generated
      # bindings and models, and fails on any compiler warning.
      - name: Check
        working-directory: desktop/frontend
        run: npm run check

      - name: Build
        working-directory: desktop/frontend
        run: npm run build

      # Now that frontend/dist exists, the embed directive resolves and the
      # root package can finally be vetted — the only place the App itself
      # gets checked.
      - name: Vet the root package
        working-directory: desktop
        run: go vet -tags webkit2_41 .

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gradle's caches are kept by setup-java, not setup-gradle: from v6 the
      # latter's cache is a proprietary component under its own terms of use.
      # With caching off it is never loaded, and setup-gradle still validates
      # the wrapper jar against Gradle's published checksums.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - run: chmod +x gradlew

      # The protocol tests read testvectors/protocol.json, the same file the
      # Go tests read: a vector both implementations must agree on.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      # The release build type only otherwise runs at tag time, where a broken
      # signing or packaging setup would surface too late. With no keystore
      # here it falls back to the debug key, exactly as a fork's release does.
      - name: Assemble release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/
          if-no-files-found: ignore
