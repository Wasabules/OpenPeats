name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Build every artefact but publish nothing (no tag, no release)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

# Actions are pinned to a full commit SHA, with the version in a comment, as
# in ci.yml. This workflow holds contents: write when it publishes: a moved
# tag on a third-party action would run with that permission.

jobs:
  # The whole of CI, run against the commit being released. Every build job
  # waits for it: a tag pushed on a red commit stops here instead of
  # publishing.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # One job resolves the version so the three build jobs cannot disagree about
  # what they are producing.
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      android_code: ${{ steps.v.outputs.android_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # The input reaches the script through the environment, never pasted
      # into it: an expression expanded inside `run` is shell code, and this
      # one is typed by hand.
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # Everything downstream assumes MAJOR.MINOR.PATCH with an optional
          # pre-release suffix. Android's versionCode in particular has no room
          # for anything else.
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[4]:-}"

          # Monotonic and readable: 1.2.3 -> 10203. Minor and patch are capped
          # at 99, which the regex above cannot enforce.
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must each stay below 100 for the Android versionCode"
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))

          prerelease=false
          [ -n "$suffix" ] && prerelease=true

          echo "version=$version"        >> "$GITHUB_OUTPUT"
          echo "android_code=$code"      >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease"  >> "$GITHUB_OUTPUT"
          echo "Building $version (Android versionCode $code, prerelease=$prerelease)"

  linux:
    name: Linux
    needs: [meta, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Go, Node, the WebKit 4.1 headers and the Wails CLI — the same setup
      # CI checks with. The binary then needs libwebkit2gtk-4.1-0 at runtime,
      # which the .deb declares.
      - uses: ./.github/actions/setup-desktop
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Stamp the version
        working-directory: desktop
        run: |
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > "$tmp"
          mv "$tmp" wails.json

      - name: Build
        working-directory: desktop
        run: wails build -tags webkit2_41 -clean -platform linux/amd64

      - name: Build peatsctl
        working-directory: desktop
        run: CGO_ENABLED=0 go build -trimpath -o build/bin/peatsctl ./cmd/peatsctl

      - name: Package
        run: |
          set -euo pipefail
          bin=$PWD/desktop/build/bin
          # Absolute: the staging steps below cd elsewhere, and a relative
          # output path would silently land in the wrong directory.
          out=$PWD/dist
          mkdir -p "$out"

          # --- tarball: the binaries plus the documents a user needs ---
          stage=$(mktemp -d)/openpeats-$VERSION-linux-amd64
          mkdir -p "$stage"
          cp "$bin/openpeats" "$bin/peatsctl" "$stage/"
          cp README.md README.fr.md LICENSE "$stage/"
          tar -czf "$out/openpeats-$VERSION-linux-amd64.tar.gz" \
              -C "$(dirname "$stage")" "$(basename "$stage")"

          # --- .deb ---
          root=$(mktemp -d)
          install -Dm755 "$bin/openpeats" "$root/usr/bin/openpeats"
          install -Dm755 "$bin/peatsctl"   "$root/usr/bin/peatsctl"
          install -Dm644 packaging/linux/openpeats.desktop \
              "$root/usr/share/applications/openpeats.desktop"
          install -Dm644 desktop/build/appicon.png \
              "$root/usr/share/icons/hicolor/512x512/apps/openpeats.png"
          install -Dm644 LICENSE "$root/usr/share/doc/openpeats/copyright"

          mkdir -p "$root/DEBIAN"
          sed -e "s|@VERSION@|$VERSION|" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|" \
              packaging/linux/control.in > "$root/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$root" \
              "$out/openpeats_${VERSION}_amd64.deb"

          cp "$bin/peatsctl" "$out/peatsctl-$VERSION-linux-amd64"
          ls -lh "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: [meta, ci]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-desktop
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The runner image ships NSIS, but that is an image detail rather than a
      # guarantee — installing it when absent keeps the workflow reproducible
      # on a self-hosted runner.
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: Stamp the version
        shell: bash
        working-directory: desktop
        run: |
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > "$tmp"
          mv "$tmp" wails.json

      # -nsis also produces the portable exe, so one invocation covers both
      # artefacts.
      - name: Build
        shell: bash
        working-directory: desktop
        run: wails build -clean -platform windows/amd64 -nsis

      - name: Build peatsctl
        shell: bash
        working-directory: desktop
        run: CGO_ENABLED=0 go build -trimpath -o build/bin/peatsctl.exe ./cmd/peatsctl

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=$PWD/desktop/build/bin
          # Absolute: 7z runs from the staging directory below.
          out=$PWD/dist
          mkdir -p "$out"

          stage=$(mktemp -d)/openpeats-$VERSION-windows-amd64
          mkdir -p "$stage"
          cp "$bin/openpeats.exe" "$bin/peatsctl.exe" "$stage/"
          cp README.md README.fr.md LICENSE "$stage/"
          (cd "$(dirname "$stage")" && \
            7z a -tzip "$out/openpeats-$VERSION-windows-amd64.zip" \
                "$(basename "$stage")")

          # Wails names the installer after the project, not the version.
          installer=$(find "$bin" -name '*installer*.exe' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::NSIS installer not produced"
            exit 1
          fi
          cp "$installer" "$out/openpeats-$VERSION-windows-amd64-installer.exe"

          cp "$bin/peatsctl.exe" "$out/peatsctl-$VERSION-windows-amd64.exe"
          ls -lh "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    needs: [meta, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.android_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - run: chmod +x android/gradlew

      # The release key is optional: a fork with no secrets gets an APK signed
      # with the debug key rather than a failed run. The runner creates that key
      # on the spot, so such an APK installs but cannot update a previous one.
      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — signing with this runner's throwaway debug key; the APK will not update a previous install"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(
            --no-daemon
            -Popenpeats.versionName="$VERSION"
            -Popenpeats.versionCode="$VERSION_CODE"
          )
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            args+=(
              -Popenpeats.keystore="$RUNNER_TEMP/keystore.jks"
              -Popenpeats.keystorePassword="$KEYSTORE_PASSWORD"
              -Popenpeats.keyAlias="$KEY_ALIAS"
              -Popenpeats.keyPassword="$KEY_PASSWORD"
            )
          fi
          ./gradlew "${args[@]}" :app:assembleRelease :app:bundleRelease

      - name: Package
        run: |
          set -euo pipefail
          out=dist
          mkdir -p "$out"
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)

          if [ -z "$apk" ]; then
            echo "::error::no APK produced"
            exit 1
          fi

          cp "$apk" "$out/openpeats-$VERSION.apk"
          [ -n "$aab" ] && cp "$aab" "$out/openpeats-$VERSION.aab"
          ls -lh "$out"

      # The repository .gitignore excludes *.apk to keep the manufacturer's APK
      # out of git. This one is our own build, uploaded straight from the
      # runner, so it never passes through git at all.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [meta, linux, windows, android]
    # A dry run stops once every artefact is built: the build jobs are the
    # part worth rehearsing, and they only otherwise run at tag time.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging

      - name: Collect artefacts and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          echo "--- release contents ---"
          cat SHA256SUMS

      # The release body is the CHANGELOG section for the version being built:
      # the notes are written once, reviewed in a diff like everything else,
      # and cannot drift from what actually shipped. A version with no section
      # fails the release rather than publishing one with nothing to read.
      - name: Assemble the release notes
        run: |
          set -euo pipefail
          section=$(awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found                    { print }
          ' CHANGELOG.md | sed '/./,$!d')

          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION — add one before tagging"
            exit 1
          fi

          echo "$section" > notes.md

          # Separated from the changelog: what follows is the same boilerplate
          # every release carries, not part of the version's notes.
          { echo; echo '---'; echo; } >> notes.md

          cat >> notes.md <<'FOOTER'
          Open control for SoundPEATS earbuds — see the
          [README](https://github.com/${{ github.repository }}/blob/main/README.md).

          The interface ships in English and French and follows the system
          language; the desktop app also has a picker in its top bar.

          | Platform | File |
          |---|---|
          | Linux (Debian/Ubuntu) | `openpeats_${{ env.VERSION }}_amd64.deb` |
          | Linux (portable) | `openpeats-${{ env.VERSION }}-linux-amd64.tar.gz` |
          | Windows (installer) | `openpeats-${{ env.VERSION }}-windows-amd64-installer.exe` |
          | Windows (portable) | `openpeats-${{ env.VERSION }}-windows-amd64.zip` |
          | Android | `openpeats-${{ env.VERSION }}.apk` |

          The Linux build needs `libwebkit2gtk-4.1-0` (Ubuntu 24.04+,
          Fedora 39+); the `.deb` declares it. `peatsctl` is a command line
          tool for checking the transport without a GUI.

          Verify your download against `SHA256SUMS`.
          FOOTER

          echo "--- release notes ---"
          cat notes.md

      # target_commitish matters for a manual run, where the tag does not
      # exist yet: without it the action creates the tag on the default
      # branch as it stands at publish time, not on the commit that was built.
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', env.VERSION) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OpenPeats ${{ env.VERSION }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body_path: notes.md
